# ===============================
# THÔNG TIN ỨNG DỤNG
# ===============================
spring.application.name=fashion-ecommerce

# ===============================
# CẤU HÌNH JPA & HIBERNATE
# ===============================
# BẮT BUỘC tắt OSIV trong Clean Architecture
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# 2. KIỂM SOÁT LOGGING (Đảm bảo KHÔNG in SQL)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
# --- Tối ưu hóa Batch Insert/Update (Chuẩn bị cho Flash Sale) ---
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# --- Tối ưu hóa sinh ID và Performance ---
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.generate_statistics=false

# --- Tối ưu Network Roundtrip ---
# Báo cho Hibernate biết Hikari đã tắt auto-commit
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===============================
# CẤU HÌNH DATASOURCE CUSTOM (MODULE COMMON)
# ─── đồng bộ với compose.yaml → service: pgvector ───
# POSTGRES_DB: mydatabase | POSTGRES_USER: myuser | POSTGRES_PASSWORD: secret | port: 5432
# ===============================
common.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/mydatabase
common.datasource.hikari.username=myuser
common.datasource.hikari.password=secret
common.datasource.hikari.driver-class-name=org.postgresql.Driver
common.datasource.hikari.pool-name=CommonPostgresPool

# --- HikariCP Best Practices (High Concurrency) ---
common.datasource.hikari.minimum-idle=10
common.datasource.hikari.maximum-pool-size=50
common.datasource.hikari.connection-timeout=3000
common.datasource.hikari.idle-timeout=600000
common.datasource.hikari.max-lifetime=1800000
# Set false để Application Service (UseCase) tự quản lý Transaction
common.datasource.hikari.auto-commit=false

# ==========================================
# 1. REDIS CONNECTION CORE
# ─── đồng bộ với compose.yaml → service: redis ───
# image: redis:7.2-alpine | port: 6379 | no password
# ==========================================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# ==========================================
# 2. TIMEOUT BEST PRACTICES (Cực kỳ quan trọng)
# ==========================================
# Thời gian chờ tối đa khi thiết lập kết nối socket ban đầu tới Redis
spring.data.redis.connect-timeout=2000
# Thời gian chờ tối đa để đọc/ghi một lệnh Redis (Ngăn chặn việc Thread của Spring bị treo vô thời hạn)
spring.data.redis.timeout=2000

# ==========================================
# 3. LETTUCE CONNECTION POOLING (Bắt buộc cho High Load)
# ==========================================
# Kích hoạt tính năng Pooling
spring.data.redis.lettuce.pool.enabled=true

# Số lượng connection tối đa được phép mở đồng thời.
# (Set cao hơn mức mặc định 8 để xử lý hàng ngàn request cùng lúc)
spring.data.redis.lettuce.pool.max-active=100

# Số connection rảnh rỗi (idle) tối đa được giữ lại trong pool.
# Tránh việc đóng/mở connection liên tục gây tốn CPU.
spring.data.redis.lettuce.pool.max-idle=50

# Số connection rảnh rỗi tối thiểu LUÔN ĐƯỢC DUY TRÌ.
# Giúp hệ thống luôn ở trạng thái "sẵn sàng chiến đấu" khi có luồng traffic đột ngột đổ vào.
spring.data.redis.lettuce.pool.min-idle=10

# Thời gian chờ tối đa khi một Thread xin connection từ pool mà pool đã đầy.
# Nếu quá 2000ms mà không có connection trống, sẽ ném ra lỗi (Tránh việc treo cả hệ thống).
spring.data.redis.lettuce.pool.max-wait=2000ms

# Thời gian định kỳ (10s) để pool chạy background task kiểm tra và dọn dẹp các connection bị chết/timeout.
spring.data.redis.lettuce.pool.time-between-eviction-runs=10s

# ==========================================
# MONGODB DATABASE CONFIGURATION
# ─── đồng bộ với compose.yaml → service: mongodb ───
# MONGO_INITDB_ROOT_USERNAME: admin | MONGO_INITDB_ROOT_PASSWORD: secret | port: 27017
# LƯU Ý: MongoDB standalone (1 node) không hỗ trợ Transactions → bỏ replicaSet trong dev
# ==========================================

# URI kết nối đơn giản cho môi trường Dev (single-node, không replica set)
spring.mongodb.uri=mongodb://admin:secret@localhost:27017/fashion_db?authSource=admin&maxPoolSize=100&minPoolSize=10&connectTimeoutMS=5000

# Best practice cho UUID: Chuẩn hóa cách lưu UUID trong MongoDB (tránh lỗi định dạng LUUID cũ)
spring.mongodb.representation.uuid=standard

# Tắt auto-index creation trên môi trường production (Nên quản lý index bằng script/migration tool như Mongock để an toàn)
spring.data.mongodb.auto-index-creation=false


# application.properties

# ==========================================
# SEAWEEDFS S3 CONFIGURATION
# ─── đồng bộ với compose.yaml → service: seaweedfs-s3 ───
# S3 API port: 8333
# ==========================================
# Endpoint của S3 Gateway dùng để Upload/Delete (Internal)
seaweedfs.s3.endpoint=http://localhost:8333
# Endpoint của Filer dùng để Read/Download public với tốc độ cao nhất (External)
seaweedfs.s3.filer-endpoint=http://localhost:8888
# Dummy region cho chuẩn S3 client
seaweedfs.s3.region=us-east-1

# Thay bằng key thật hoặc cấu hình env
seaweedfs.s3.access-key=your-seaweedfs-access-key

# Thay bằng secret key thật hoặc cấu hình env
seaweedfs.s3.secret-key=your-seaweedfs-secret-key

# Tên bucket mặc định
seaweedfs.s3.bucket=my-fashion-bucket

# Cấu hình In-Process Server (Chạy trên RAM)
spring.grpc.server.inprocess.name=my-monolith-server
# Cấu hình các Channel Client
# catalog-service-grpc là tên channel để dùng trong @GrpcClient
spring.grpc.client.channels.catalog-service-grpc.address=in-process:my-monolith-server
spring.grpc.client.channels.catalog-service-grpc.negotiation-type=plaintext

# ==========================================
# 1. KAFKA PRODUCER (BEST PRACTICE CHO E-COMMERCE)
# ─── đồng bộ với compose.yaml → service: kafka ───
# EXTERNAL listener: localhost:29092 (dùng từ host machine)
# INTERNAL listener: kafka:9092     (dùng giữa các container)
# ==========================================
spring.kafka.producer.bootstrap-servers=localhost:29092
# Gửi Key và Value dưới dạng String (Object sẽ được ObjectMapper chuyển thành chuỗi JSON ở code)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# [QUAN TRỌNG NHẤT] Đảm bảo không bao giờ mất message
# acks=all: Bắt buộc tất cả các bản sao (replicas) của Kafka phải xác nhận đã lưu message thì mới tính là thành công.
spring.kafka.producer.acks=all

# Bật tính năng Idempotence (Chống gửi trùng lặp message nếu network chập chờn)
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.retries=2147483647


# ==========================================
# 2. KAFKA CONSUMER (KHỚP VỚI CODE MANUAL ACK CỦA BẠN)
# ─── đồng bộ với compose.yaml → service: kafka ───
# EXTERNAL listener: localhost:29092
# ==========================================
spring.kafka.consumer.bootstrap-servers=localhost:29092
# Bắt buộc dùng StringDeserializer vì trong code Listener ta nhận ConsumerRecord<String, String> và tự parse bằng ObjectMapper
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Group ID mặc định (có thể bị ghi đè ở annotation @KafkaListener)
spring.kafka.consumer.group-id=fashion-ecommerce-group

# [QUAN TRỌNG] Tắt auto-commit vì chúng ta đã setup AckMode.MANUAL_IMMEDIATE trong KafkaEventBusConfig
spring.kafka.consumer.enable-auto-commit=false

# Nếu app mới chạy lần đầu và tạo group mới, hãy đọc từ message cũ nhất để không bỏ lót event nào
spring.kafka.consumer.auto-offset-reset=earliest

# Lượng message tối đa kéo về trong 1 lần poll (Rất quan trọng cho Batch Listener)
# Set mức 50-100 để tránh timeout khi xử lý batch quá lớn
spring.kafka.consumer.max-poll-records=50
# Tăng thời gian tối đa để xử lý xong 1 batch trước khi Kafka đánh giá là Consumer bị chết (treo)
spring.kafka.consumer.properties.max.poll.interval.ms=300000


# ==========================================
# 3. SPRING MODULITH OUTBOX (THE MISSING PIECE)
# ==========================================
# Tự động tạo bảng 'event_publication' trong Database (PostgreSQL/MySQL) để lưu event chưa gửi
spring.modulith.events.jdbc.schema-initialization.enabled=true

# [BEST PRACTICE] Khi app bị crash và restart lại, tự động quét bảng Outbox và gửi lại các event chưa hoàn thành
spring.modulith.events.republish-outstanding-events-on-restart=true


# ==========================================
# 4. LOGGING TRACING (HIỂN THỊ CORRELATION_ID)
# ==========================================
# Bổ sung %X{correlationId} và %X{userId} vào log pattern để lấy data từ MDC đã setup
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}][%X{userId}] - %msg%n
logging.level.io.github.nguyennhatquang.fashion=DEBUG
logging.level.org.springframework.kafka=INFO


### ==========================================
# 5. KEYCLOAK CONFIGURATION
# ─── đồng bộ với compose.yaml → service: keycloak ───
# Keycloak HTTP port mapping: 8180:8080 (host:container)
# Admin creds: admin / admin_secret
# Realm: master (tạo realm riêng cho app sau)
##  ==========================================
# Thay đổi URL và Tên Realm cho phù hợp với Keycloak của bạn
# Keycloak expose ra host machine qua port 8180
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/fashion-realm

# JWK Set URI thường tự động được suy ra từ issuer-uri, nhưng khai báo rõ ràng là best practice
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

# Tùy chọn: Log mức DEBUG cho security để dễ troubleshooting khi setup
logging.level.org.springframework.security=DEBUG

# Keycloak Admin Client (dùng để quản lý users/realms qua API)
# server-url trỏ tới host port 8180 (mapped từ container port 8080)
keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin_secret


# ===================================================================
# ELASTICSEARCH INFRASTRUCTURE CONFIGURATION
# ─── đồng bộ với compose.yaml → service: elasticsearch ───
# xpack.security.enabled: false → không cần username/password
# port: 9200
# ===================================================================
spring.elasticsearch.uris=http://localhost:9200
# Authentication (?? tr?ng n?u local kh�ng d�ng, set gi� tr? cho m�i tr??ng Prod)
spring.elasticsearch.username=elastic
spring.elasticsearch.password=your_secure_password

# Connection & Pool Settings (Best Practice để tránh Timeout/Memory Leak)
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

# ---------------------------------------------------------
# NEO4J DATABASE CONFIGURATION (Best Practice)
# ─── đồng bộ với compose.yaml → service: neo4j ───
# NEO4J_AUTH: neo4j/secret | Bolt port: 7687
# ---------------------------------------------------------
spring.neo4j.uri=neo4j://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=secret

# Cấu hình Database cụ thể (Nếu dùng Neo4j 4.0+ hoặc 5.x)
spring.neo4j.database=neo4j

# Cấu hình Connection Pool cho Production
spring.neo4j.pool.metrics-enabled=true
spring.neo4j.pool.max-connection-pool-size=100
spring.neo4j.pool.max-connection-lifetime=1h
spring.neo4j.pool.connection-acquisition-timeout=30s
spring.neo4j.pool.idle-time-before-connection-test=30s
##AI CONFIGURATION
# Cấu hình Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.options.model=bge-m3

# Cấu hình Vector Store (PGVector)
# ─── đồng bộ với compose.yaml → service: pgvector ───
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024

# Cờ quan trọng để tự động tạo bảng
spring.ai.vectorstore.pgvector.initialize-schema=true

# ==========================================
# CASSANDRA BASIC CONFIGURATION
# ─── đồng bộ với compose.yaml → service: cassandra ───
# image: cassandra:5.0 | CQL port: 9042
# CASSANDRA_DC: dc1 | CASSANDRA_CLUSTER_NAME: FashionCluster
# Cassandra mặc định không có auth (AllowAllAuthenticator)
# ==========================================
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042
spring.cassandra.local-datacenter=dc1
spring.cassandra.keyspace-name=fashion_keyspace
# PasswordAuthenticator đã bật trong compose.yaml → dùng user mặc định cassandra/cassandra
# ⚠ï¸ Tạo user riêng và đổi password ngay sau khi khởi động lần đầu:
#   CREATE ROLE fashion_user WITH LOGIN = true AND PASSWORD = 'your_password';
#   GRANT ALL ON KEYSPACE fashion_keyspace TO fashion_user;
spring.cassandra.username=cassandra
spring.cassandra.password=cassandra

# ==========================================
# CASSANDRA BEST PRACTICE: SCHEMA & POOLING
# ==========================================
# Đối với môi trường Prod, luôn để là NONE và dùng công cụ migrate (như Liquibase/Cassandra-migration)
# Trong môi trường Dev, có thể dùng CREATE_IF_NOT_EXISTS
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# Cấu hình Pool cơ bản từ phía Spring Data (Chi tiết hơn sẽ config ở Java level)
spring.cassandra.pool.heartbeat-interval=30s
spring.cassandra.pool.idle-timeout=120s

# Timeouts cơ bản
spring.cassandra.connection.connect-timeout=5s
spring.cassandra.connection.init-query-timeout=5s
spring.cassandra.request.timeout=2s

# Tối ưu hóa metrics (nếu dự án có dùng Actuator/Prometheus)
spring.cassandra.metrics.enabled=true