# ===============================
# THÔNG TIN ỨNG DỤNG
# ===============================
spring.application.name=fashion-ecommerce

# ===============================
# CẤU HÌNH JPA & HIBERNATE
# ===============================
# BẮT BUỘC tắt OSIV trong Clean Architecture
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# 2. KIỂM SOÁT LOGGING (Đảm bảo KHÔNG in SQL)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
# --- Tối ưu hóa Batch Insert/Update (Chuẩn bị cho Flash Sale) ---
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# --- Tối ưu hóa sinh ID và Performance ---
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.generate_statistics=false

# --- Tối ưu Network Roundtrip ---
# Báo cho Hibernate biết Hikari đã tắt auto-commit
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===============================
# CẤU HÌNH DATASOURCE CUSTOM (MODULE COMMON)
# ===============================
common.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/your_database
common.datasource.hikari.username=your_username
common.datasource.hikari.password=your_password
common.datasource.hikari.driver-class-name=org.postgresql.Driver
common.datasource.hikari.pool-name=CommonPostgresPool

# --- HikariCP Best Practices (High Concurrency) ---
common.datasource.hikari.minimum-idle=10
common.datasource.hikari.maximum-pool-size=50
common.datasource.hikari.connection-timeout=3000
common.datasource.hikari.idle-timeout=600000
common.datasource.hikari.max-lifetime=1800000
# Set false để Application Service (UseCase) tự quản lý Transaction
common.datasource.hikari.auto-commit=false

# ==========================================
# 1. REDIS CONNECTION CORE
# ==========================================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# ==========================================
# 2. TIMEOUT BEST PRACTICES (Cực kỳ quan trọng)
# ==========================================
# Thời gian chờ tối đa khi thiết lập kết nối socket ban đầu tới Redis
spring.data.redis.connect-timeout=2000
# Thời gian chờ tối đa để đọc/ghi một lệnh Redis (Ngăn chặn việc Thread của Spring bị treo vô thời hạn)
spring.data.redis.timeout=2000

# ==========================================
# 3. LETTUCE CONNECTION POOLING (Bắt buộc cho High Load)
# ==========================================
# Kích hoạt tính năng Pooling
spring.data.redis.lettuce.pool.enabled=true

# Số lượng connection tối đa được phép mở đồng thời. 
# (Set cao hơn mức mặc định 8 để xử lý hàng ngàn request cùng lúc)
spring.data.redis.lettuce.pool.max-active=100

# Số connection rảnh rỗi (idle) tối đa được giữ lại trong pool. 
# Tránh việc đóng/mở connection liên tục gây tốn CPU.
spring.data.redis.lettuce.pool.max-idle=50

# Số connection rảnh rỗi tối thiểu LUÔN ĐƯỢC DUY TRÌ. 
# Giúp hệ thống luôn ở trạng thái "sẵn sàng chiến đấu" khi có luồng traffic đột ngột đổ vào.
spring.data.redis.lettuce.pool.min-idle=10

# Thời gian chờ tối đa khi một Thread xin connection từ pool mà pool đã đầy.
# Nếu quá 2000ms mà không có connection trống, sẽ ném ra lỗi (Tránh việc treo cả hệ thống).
spring.data.redis.lettuce.pool.max-wait=2000ms

# Thời gian định kỳ (10s) để pool chạy background task kiểm tra và dọn dẹp các connection bị chết/timeout.
spring.data.redis.lettuce.pool.time-between-eviction-runs=10s
