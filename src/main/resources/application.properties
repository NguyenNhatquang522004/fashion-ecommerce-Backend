# ===============================
# THÔNG TIN ỨNG DỤNG
# ===============================
spring.application.name=fashion-ecommerce

# ===============================
# CẤU HÌNH JPA & HIBERNATE
# ===============================
# BẮT BUỘC tắt OSIV trong Clean Architecture
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# 2. KIỂM SOÁT LOGGING (Đảm bảo KHÔNG in SQL)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
# --- Tối ưu hóa Batch Insert/Update (Chuẩn bị cho Flash Sale) ---
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# --- Tối ưu hóa sinh ID và Performance ---
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.generate_statistics=false

# --- Tối ưu Network Roundtrip ---
# Báo cho Hibernate biết Hikari đã tắt auto-commit
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===============================
# CẤU HÌNH DATASOURCE CUSTOM (MODULE COMMON)
# ===============================
common.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/your_database
common.datasource.hikari.username=your_username
common.datasource.hikari.password=your_password
common.datasource.hikari.driver-class-name=org.postgresql.Driver
common.datasource.hikari.pool-name=CommonPostgresPool

# --- HikariCP Best Practices (High Concurrency) ---
common.datasource.hikari.minimum-idle=10
common.datasource.hikari.maximum-pool-size=50
common.datasource.hikari.connection-timeout=3000
common.datasource.hikari.idle-timeout=600000
common.datasource.hikari.max-lifetime=1800000
# Set false để Application Service (UseCase) tự quản lý Transaction
common.datasource.hikari.auto-commit=false

# ==========================================
# 1. REDIS CONNECTION CORE
# ==========================================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# ==========================================
# 2. TIMEOUT BEST PRACTICES (Cực kỳ quan trọng)
# ==========================================
# Thời gian chờ tối đa khi thiết lập kết nối socket ban đầu tới Redis
spring.data.redis.connect-timeout=2000
# Thời gian chờ tối đa để đọc/ghi một lệnh Redis (Ngăn chặn việc Thread của Spring bị treo vô thời hạn)
spring.data.redis.timeout=2000

# ==========================================
# 3. LETTUCE CONNECTION POOLING (Bắt buộc cho High Load)
# ==========================================
# Kích hoạt tính năng Pooling
spring.data.redis.lettuce.pool.enabled=true

# Số lượng connection tối đa được phép mở đồng thời. 
# (Set cao hơn mức mặc định 8 để xử lý hàng ngàn request cùng lúc)
spring.data.redis.lettuce.pool.max-active=100

# Số connection rảnh rỗi (idle) tối đa được giữ lại trong pool. 
# Tránh việc đóng/mở connection liên tục gây tốn CPU.
spring.data.redis.lettuce.pool.max-idle=50

# Số connection rảnh rỗi tối thiểu LUÔN ĐƯỢC DUY TRÌ. 
# Giúp hệ thống luôn ở trạng thái "sẵn sàng chiến đấu" khi có luồng traffic đột ngột đổ vào.
spring.data.redis.lettuce.pool.min-idle=10

# Thời gian chờ tối đa khi một Thread xin connection từ pool mà pool đã đầy.
# Nếu quá 2000ms mà không có connection trống, sẽ ném ra lỗi (Tránh việc treo cả hệ thống).
spring.data.redis.lettuce.pool.max-wait=2000ms

# Thời gian định kỳ (10s) để pool chạy background task kiểm tra và dọn dẹp các connection bị chết/timeout.
spring.data.redis.lettuce.pool.time-between-eviction-runs=10s

# ==========================================
# MONGODB DATABASE CONFIGURATION 
# ==========================================

# Cấu hình chuẩn Production: Bao gồm Authentication, Replica Set (Bắt buộc cho Transaction), và Connection Pooling
spring.mongodb.uri=mongodb://<username>:<password>@<host1>:27017,<host2>:27017/<database_name>?authSource=admin&replicaSet=rs0&maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=10000&connectTimeoutMS=5000

# Best practice cho UUID: Chuẩn hóa cách lưu UUID trong MongoDB (tránh lỗi định dạng LUUID cũ)
spring.mongodb.representation.uuid=standard

# Tắt auto-index creation trên môi trường production (Nên quản lý index bằng script/migration tool như Mongock để an toàn)
spring.data.mongodb.auto-index-creation=false


# application.properties

# Port S3 của SeaweedFS (mặc định là 8333)
seaweedfs.s3.endpoint=http://localhost:8333

# Dummy region cho chuẩn S3 client
seaweedfs.s3.region=us-east-1

# Thay bằng key thật hoặc cấu hình env
seaweedfs.s3.access-key=your-seaweedfs-access-key

# Thay bằng secret key thật hoặc cấu hình env
seaweedfs.s3.secret-key=your-seaweedfs-secret-key

# Tên bucket mặc định
seaweedfs.s3.bucket=my-fashion-bucket

# Cấu hình In-Process Server (Chạy trên RAM)
spring.grpc.server.inprocess.name=my-monolith-server
# Cấu hình các Channel Client
# catalog-service-grpc là tên channel để dùng trong @GrpcClient
spring.grpc.client.channels.catalog-service-grpc.address=in-process:my-monolith-server
spring.grpc.client.channels.catalog-service-grpc.negotiation-type=plaintext

# ==========================================
# 1. KAFKA PRODUCER (BEST PRACTICE CHO E-COMMERCE)
# ==========================================
spring.kafka.producer.bootstrap-servers=localhost:9092
# Gửi Key và Value dưới dạng String (Object sẽ được ObjectMapper chuyển thành chuỗi JSON ở code)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# [QUAN TRỌNG NHẤT] Đảm bảo không bao giờ mất message
# acks=all: Bắt buộc tất cả các bản sao (replicas) của Kafka phải xác nhận đã lưu message thì mới tính là thành công.
spring.kafka.producer.acks=all

# Bật tính năng Idempotence (Chống gửi trùng lặp message nếu network chập chờn)
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.retries=2147483647


# ==========================================
# 2. KAFKA CONSUMER (KHỚP VỚI CODE MANUAL ACK CỦA BẠN)
# ==========================================
spring.kafka.consumer.bootstrap-servers=localhost:9092
# Bắt buộc dùng StringDeserializer vì trong code Listener ta nhận ConsumerRecord<String, String> và tự parse bằng ObjectMapper
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Group ID mặc định (có thể bị ghi đè ở annotation @KafkaListener)
spring.kafka.consumer.group-id=fashion-ecommerce-group

# [QUAN TRỌNG] Tắt auto-commit vì chúng ta đã setup AckMode.MANUAL_IMMEDIATE trong KafkaEventBusConfig
spring.kafka.consumer.enable-auto-commit=false

# Nếu app mới chạy lần đầu và tạo group mới, hãy đọc từ message cũ nhất để không bỏ lót event nào
spring.kafka.consumer.auto-offset-reset=earliest

# Lượng message tối đa kéo về trong 1 lần poll (Rất quan trọng cho Batch Listener)
# Set mức 50-100 để tránh timeout khi xử lý batch quá lớn
spring.kafka.consumer.max-poll-records=50
# Tăng thời gian tối đa để xử lý xong 1 batch trước khi Kafka đánh giá là Consumer bị chết (treo)
spring.kafka.consumer.properties.max.poll.interval.ms=300000


# ==========================================
# 3. SPRING MODULITH OUTBOX (THE MISSING PIECE)
# ==========================================
# Tự động tạo bảng 'event_publication' trong Database (PostgreSQL/MySQL) để lưu event chưa gửi
spring.modulith.events.jdbc.schema-initialization.enabled=true

# [BEST PRACTICE] Khi app bị crash và restart lại, tự động quét bảng Outbox và gửi lại các event chưa hoàn thành
spring.modulith.events.republish-outstanding-events-on-restart=true


# ==========================================
# 4. LOGGING TRACING (HIỂN THỊ CORRELATION_ID)
# ==========================================
# Bổ sung %X{correlationId} và %X{userId} vào log pattern để lấy data từ MDC đã setup
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}][%X{userId}] - %msg%n
logging.level.io.github.nguyennhatquang.fashion=DEBUG
logging.level.org.springframework.kafka=INFO